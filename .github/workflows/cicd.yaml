name: cicd
on:
    push:
        paths:
            - 'src/**'
        branches:
            - main
jobs:
    ci:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v3

            - name: Shortem commit hash
              shell: bash
              run: | 
                echo "COMMIT_ID=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
            
            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_HUB_USERNAME }}
                  password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

            - name: Build and push Docker image
              uses: docker/build-push-action@v4
              with:
                  context: .
                  push: true
                  tags: k0dy/python-app:${{ env.COMMIT_ID }}
        outputs:
          commit_id: ${{ env.COMMIT_ID }}
    cd:
        needs: ci
        runs-on: self-hosted
        steps:
            - name: Checkout repository
              uses: actions/checkout@v3

            - name: Setup yq
              run: |
                YQ_VERSION=v4.44.3
                curl -sSL https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64 \
                 -o /usr/local/bin/yq
                chmod +x /usr/local/bin/yq
            - name: Modify values file
              run: |
                echo "Commit: ${{ needs.ci.outputs.commit_id }}"
                yq -i '.image.tag = "${{ needs.ci.outputs.commit_id }}"' charts/python-app/values.yaml

            
            - name: Check values.yaml
              run: |
                cat charts/python-app/values.yaml

            - name: Commit Changes
              uses: EndBug/add-and-commit@v9
              with:
                message: "ci: update image tag to ${{needs.ci.outputs.commit_id}}"
                
            - name: Install Argocd CLI
              shell: bash
              run: |
                mkdir -p $HOME/bin

                curl -sSL -o $HOME/bin/argocd \
                  https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64

                chmod +x $HOME/bin/argocd

                echo "$HOME/bin" >> $GITHUB_PATH

                
            - name: Login Argocd Application
              shell: bash
              run: |
                argocd login ${{ secrets.ARGOCD_SERVER }} \
                --grpc-web \
                --insecure \
                --username ${{ secrets.ARGOCD_USERNAME }} \
                --password ${{ secrets.ARGOCD_PASSWORD }}
            - name: Sync Argocd Application
              shell: bash
              run: |
                argocd app sync python-app
